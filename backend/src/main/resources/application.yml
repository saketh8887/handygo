server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: handyconnect-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:gateway01.ap-northeast-1.prod.aws.tidbcloud.com}:${DB_PORT:4000}/${DB_NAME:handyconnect_db}?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:25oub13Sjpn7RuG.root}
    password: ${DB_PASSWORD:grR9kCzyj2aBRR12}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    open-in-view: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 35MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

handyconnect:
  upload:
    dir: ${UPLOAD_DIR:uploads/attachments}
    max-file-size: 5242880 # 5 MB per file
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  admin:
    default-email: ${ADMIN_DEFAULT_EMAIL:admin@handyconnect.local}
    default-password: ${ADMIN_DEFAULT_PASSWORD:Password123!}
  dispatch:
    auto-assign-enabled: ${DISPATCH_AUTO_ASSIGN:false}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
